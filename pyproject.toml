[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repofit"
version = "0.1.1"
description = "Find GitHub projects that fit you, using what your coding agents already know about you."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Taiheng Pan" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["github", "recommendation", "mcp", "claude-code", "codex", "cursor", "agents", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]

[project.optional-dependencies]
anthropic = ["anthropic"]

[project.urls]
Homepage = "https://github.com/pth2002/repofit"
Repository = "https://github.com/pth2002/repofit"
Issues = "https://github.com/pth2002/repofit/issues"

[project.scripts]
repofit = "repofit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repofit"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["src/repofit", "tests", "README.md", "LICENSE", "pyproject.toml"]
